<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fahrbuch"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.svg"><title>Fahrbuch</title><link rel="stylesheet" href="style.css"></head>
<body><div id="app"><header><h1>Fahrbuch</h1><button id="addTop">＋</button></header>
<main>
<section id="dashboard" class="view active"><div class="monthbar"><button id="prevMonth">‹</button><strong id="monthLabel"></strong><button id="nextMonth">›</button></div><div class="cards"><div><span>Fahrten</span><b id="count">0</b></div><div><span>Kilometer</span><b id="km">0 km</b></div><div><span>Fahrzeit</span><b id="hours">0:00 h</b></div><div><span>&gt; 8 Stunden</span><b id="over8">0 / 10</b></div></div><div class="progress"><div id="progress"></div></div><div class="panel"><h2>Letzte Fahrten</h2><div id="recent"></div></div></section>
<section id="fahrten" class="view"><div class="sectionHead"><h2>Fahrten</h2><button class="primary" id="addBtn">Neue Fahrt</button></div><input id="search" class="input" placeholder="Suchen…"><div id="list"></div></section>
<section id="auswertung" class="view"><h2>Auswertung</h2><div class="panel"><div id="stats"></div></div></section>
<section id="form" class="view"><h2 id="formTitle">Neue Fahrt</h2><form id="fahrtForm"><input type="hidden" id="editId"><label>Datum<input type="date" id="date" required></label><div class="row"><label>Startzeit<input type="time" id="start" required></label><label>Endzeit<input type="time" id="end" required></label></div><label>Startort<input id="from" placeholder="z. B. Duisburg"></label><label>Ziel<input id="to" placeholder="Ziel"></label><label>Kilometer<input type="number" id="kmInput" min="0" step="0.1" inputmode="decimal"></label><label>Zweck<input id="purpose" placeholder="z. B. Dienstfahrt"></label><label>Notiz<textarea id="note" rows="3"></textarea></label><div class="actions"><button type="button" class="secondary" id="cancel">Abbrechen</button><button class="primary">Speichern</button></div></form></section>
</main><nav><button data-view="dashboard">⌂<span>Start</span></button><button data-view="fahrten">▤<span>Fahrten</span></button><button data-view="auswertung">◫<span>Auswertung</span></button></nav></div><script src="app.js"></script></body></html>
